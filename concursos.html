<!DOCTYPE html>
<html lang="pt-BR" class="carregando">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Concursos</title>
<script src="assets/tema.js"></script>
<script src="assets/concursos.js"></script>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/sequencia.css">
</head>
<body>
<header class="top"><div class="in">
  <span class="marca">Meus Concursos</span>
  <div class="acoes">
    <span class="quem">Olá, <strong data-usuario></strong></span>
    <button class="ghost" type="button" data-tema-btn></button>
    <button class="ghost" type="button" data-sair>Sair</button>
  </div>
</div></header>

<main class="wrap">
  <div class="hub">
    <section>
      <h1 class="titulo-pg">Escolha o concurso</h1>
      <p class="sub-pg">Abra o edital verticalizado do concurso que você está estudando.</p>
      <div class="grade-concursos" id="lista"></div>
    </section>
    <aside class="card-seq" id="sequencia" aria-labelledby="tit-seq">
      <h2 id="tit-seq">Sequência de estudo</h2>
      <div class="sq" id="sq"></div>
    </aside>
  </div>
  <footer class="rodape">Seu progresso fica salvo na sua conta e aparece igual em qualquer aparelho.</footer>
</main>

<script type="module">
import { iniciarPagina } from "./assets/app.js";
import { montarSequencia } from "./assets/sequencia.js";

const { dados } = await iniciarPagina();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const estudados = c => Object.values(dados.progresso[c.id] || {}).filter(b => (b & 0b111) !== 0).length;

document.getElementById("lista").innerHTML = CONCURSOS.map(c => {
  const f = estudados(c), p = c.assuntos ? Math.round(f / c.assuntos * 100) : 0;
  return `<a class="card-concurso" href="${esc(c.pagina)}">
    <div class="faixa"><span class="sigla">${esc(c.sigla)}</span><span class="ano">${esc(c.ano)}</span></div>
    <div class="corpo">
      <p class="cargo">${esc(c.cargo)}</p>
      <p class="orgao">${esc(c.orgao)}</p>
      <p class="desc">${esc(c.descricao)}</p>
      ${c.prova ? (() => { const t = textoProva(c.prova); return `<p class="data-prova">Prova: <strong>${t.data}</strong> · ${t.resumo}</p>`; })() : ""}
      <div class="meta">${c.materias} matérias · ${c.assuntos} assuntos · ${f} estudados (${p}%)
        <div class="prog" role="img" aria-label="${p}% estudado"><span style="width:${p}%"></span></div>
      </div>
    </div>
    <div class="ir">Abrir edital →</div>
  </a>`;
}).join("");

montarSequencia(document.getElementById("sq"), dados);
</script>
</body>
</html>
